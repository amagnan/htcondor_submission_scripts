# Optional branch: consumes successful disgen files from its checker.
step: disfilter
# upstream: disgen
options:
  --geoFile: /eos/experiment/ship/simulation/cuda_muons/try_2026_MS5/geofile_2609.root
  --filter-option: 1           # Workflow default 1 (executable default 0).
  --pythia-decays: true        # Workflow default true (executable default false).
  # --pythia-decay-seed: 0    # 0 = time-based; set a fixed positive value for reproducibility.
  # --field-map: null         # Geometry ShipGeo.Bfield.fieldMap.
  # --field-z: null           # Geometry ShipGeo.Bfield.z.
  # --muon-shield-field-map: null  # Geometry shieldName.
  # --muon-shield-field-z: null    # Geometry muShield entrance.
  # --detector-z: null        # Tr1 centre.
  # --min-charged: 2
  # --exclude-muons: false
  # --no-detector-acceptance: false
  # --detailed-histograms: false
  # --filter-efficiency-x-bounds: [-200, 200]
  # --filter-efficiency-x-bins: 5
  # --filter-efficiency-y-bounds: [-300, 300]
  # --filter-efficiency-y-bins: 5
  # --filter-efficiency-z-bounds: [2500, 9500]
  # --filter-efficiency-z-bins: 70
  # --ignore-input-containing: filtered
  # --debug: 0

# first_event: 0               # Zero-based entry; applies to each checked input.
# events_per_file: -1          # All remaining CHECKED entries; finite values cap the range.
# events_per_subjob: null      # null = one range; set a size to split by entry count.
# n_subjobs: null              # Alternative: divide into N balanced ranges. Do not set both.
# Less commonly changed workflow settings (defaults shown).
# workflow: workflow.yaml       # Relative to this file.
# name: STEP                   # Default: the step value; use a new name for a new selection.
# require_complete: true        # Wait for every upstream range; false explicitly accepts successful inputs only.
# n_jobs: -1                   # Maximum new Ganga masters per invocation; -1 = all.
# Resource overrides inherit workflow.yaml; its defaults are:
# max_runtime: 86000            # Seconds.
# memory_mb: 3000
# disk_mb: 50000                # Requested worker disk; site limits still apply.
# cpus: 1
# accounting_group: group_u_SHIP.u_ship_cg
# fs_install: /afs/cern.ch/work/a/ammagnan/FairShip-cvmfs
# workspace: ~/gangadir/workspace/ammagnan/LocalXML  # Default uses current username.
# state_dir: .state             # Relative to workflow.yaml (or this file if overridden here).
# output_base: /eos/experiment/ship/user/ammagnan/MuonDIS
# tag: TRY2026
# production: new_production
