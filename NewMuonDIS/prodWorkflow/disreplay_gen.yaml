# Less commonly changed workflow settings (defaults shown).
# workflow: workflow.yaml       # Relative to this file.
# name: STEP                   # Default: the step value; use a new name for a new selection.
# require_complete: true        # Wait for every upstream range; false explicitly accepts successful inputs only.
# n_jobs: -1                   # Maximum new Ganga masters per invocation; -1 = all.
# Resource overrides inherit workflow.yaml; its defaults are:
# max_runtime: 86000            # Seconds.
# memory_mb: 3000
