# First stage: the ONLY stage that discovers input files.
step: disgen
input_dir: /eos/experiment/ship/simulation/cuda_muons/try_2026_MS5
events_per_file: 250000        # Required for disgen; maximum input entries per file.
events_per_subjob: 25000      # Example: ten subjobs per full file; default null.
options:
  --geoFile: /eos/experiment/ship/simulation/cuda_muons/try_2026_MS5/geofile_2609.root
  --nDIS: 100                 # Workflow default 100 (executable default 1000).
  --z_min: 2000               # Workflow default 2000 cm (executable default 2500).
  --z_max: 9500               # Workflow default 9500 cm (executable default 20000).
  # --seed: null              # Omitted by default: time-based seed.
  # --debug: 0
  # --pythia-stdout: false    # true sends Pythia messages to stdout instead of fort.11.
  # --check-all-volumes: false
  # --muon-shield-field-map: null  # Geometry shieldName determines the map.
  # --muon-shield-field-z: null    # Geometry entrance determines the offset.
  # --poca-jump-threshold: 1.0     # cm.

